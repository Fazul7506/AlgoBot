name: Template Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: development
      SECRET_KEY: ci-template-validation-secret
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
      - name: Django checks
        run: python manage.py check
      - name: Compile every Django template
        run: python scripts/validate_templates.py
      - name: Compile Python
        run: python -m compileall -q .
      - name: Frontend asset and syntax audit
        run: python scripts/frontend_audit.py | tee frontend-audit-report.txt
      - name: Browser page-surface smoke tests
        run: |
          set -o pipefail
          python manage.py test tests.test_page_surface apps.market_data.test_catalogue --verbosity=1 2>&1 | tee page-surface-report.txt
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algobot-page-audit-reports
          path: |
            frontend-audit-report.txt
            page-surface-report.txt
          if-no-files-found: ignore
      # Keep canonical duplicate detection in the required CI path.
      - name: Repository hygiene audit
        run: python scripts/repository_hygiene.py
