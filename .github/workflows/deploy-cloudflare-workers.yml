name: Deploy and activate Cloudflare background workers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "render.yaml"

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TASK_DISPATCH_TOKEN: ${{ secrets.CLOUDFLARE_TASK_DISPATCH_TOKEN }}
      CLOUDFLARE_MARKET_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_MARKET_STREAM_TOKEN }}
      MARKET_STREAM_CONTROL_TOKEN: ${{ secrets.MARKET_STREAM_CONTROL_TOKEN }}
      CLOUDFLARE_TRAINING_WEBHOOK_TOKEN: ${{ secrets.CLOUDFLARE_TRAINING_WEBHOOK_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require deployment credentials and matched Django secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_TASK_DISPATCH_TOKEN CLOUDFLARE_MARKET_STREAM_TOKEN MARKET_STREAM_CONTROL_TOKEN CLOUDFLARE_TRAINING_WEBHOOK_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          if [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ [^a-fA-F0-9] ]] || [[ ${#CLOUDFLARE_ACCOUNT_ID} -ne 32 ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal Cloudflare account ID."
            exit 1
          fi
          echo "All required secrets are present; values will not be printed."
          echo "The task-dispatch and market-stream tokens must match Render's CLOUDFLARE_TASK_DISPATCH_TOKEN and CLOUDFLARE_MARKET_STREAM_TOKEN."

      - name: Install Worker toolchains
        run: |
          npm install --no-audit --no-fund --prefix cloudflare/background-scheduler
          npm install --no-audit --no-fund --prefix cloudflare/market-stream

      - name: Run source and binding preflight
        run: node cloudflare/preflight.mjs

      - name: Test scheduler
        run: npm --prefix cloudflare/background-scheduler test

      - name: Dry-run all Worker bundles
        run: |
          npx --yes wrangler deploy --dry-run --config cloudflare/ai-training-dispatcher/wrangler.jsonc
          npx --yes wrangler deploy --dry-run --config cloudflare/background-scheduler/wrangler.jsonc
          npx --yes wrangler deploy --dry-run --config cloudflare/market-stream/wrangler.jsonc

      - name: Provision queues and deploy the initial safe configuration
        run: bash cloudflare/deploy-safe.sh --apply

      - name: Configure Worker secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_TASK_DISPATCH_TOKEN" | npx --yes wrangler secret put ALGOBOT_TASK_DISPATCH_TOKEN --config cloudflare/background-scheduler/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_MARKET_STREAM_TOKEN" | npx --yes wrangler secret put CLOUDFLARE_MARKET_STREAM_TOKEN --config cloudflare/market-stream/wrangler.jsonc
          printf '%s' "$MARKET_STREAM_CONTROL_TOKEN" | npx --yes wrangler secret put MARKET_STREAM_CONTROL_TOKEN --config cloudflare/market-stream/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_TRAINING_WEBHOOK_TOKEN" | npx --yes wrangler secret put CLOUDFLARE_TRAINING_WEBHOOK_TOKEN --config cloudflare/ai-training-dispatcher/wrangler.jsonc

      - name: Activate the unified scheduler and Deriv market stream
        run: |
          set -euo pipefail
          npx --yes wrangler deploy --config cloudflare/background-scheduler/wrangler.jsonc --var CLOUDFLARE_SCHEDULER_ACTIVE:true --var ENABLE_EXECUTION_QUEUE_RECOVERY:false
          npx --yes wrangler deploy --config cloudflare/market-stream/wrangler.jsonc --var CLOUDFLARE_MARKET_STREAM_ACTIVE:true
          # Keep the legacy dispatcher's cron gate off to prevent duplicate AI schedules.
          npx --yes wrangler deploy --config cloudflare/ai-training-dispatcher/wrangler.jsonc --var AI_TRAINING_DISPATCH_ACTIVE:false

      - name: Verify deployed Worker scripts and Queue resources
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for worker in algobot-ai-training-dispatcher algobot-background-scheduler algobot-market-stream; do
            response="$(curl --fail --silent --show-error "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker")"
            printf '%s' "$response" | node -e '
              let raw = "";
              process.stdin.on("data", chunk => raw += chunk);
              process.stdin.on("end", () => {
                const payload = JSON.parse(raw);
                if (payload.success !== true) process.exit(1);
              });
            '
            echo "Verified deployed Worker script: $worker"
          done
          queues="$(curl --fail --silent --show-error "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=1000")"
          QUEUE_RESPONSE="$queues" node - <<'NODE'
          const payload = JSON.parse(process.env.QUEUE_RESPONSE || "{}");
          if (payload.success !== true || !Array.isArray(payload.result)) {
            throw new Error("Cloudflare Queue listing failed");
          }
          const actual = new Set(payload.result.map(queue => queue.queue_name));
          const required = [
            "algobot-ai-training", "algobot-ai-training-dlq",
            "algobot-background-tasks", "algobot-background-tasks-dlq",
            "algobot-market-ticks", "algobot-market-ticks-dlq",
          ];
          const missing = required.filter(name => !actual.has(name));
          if (missing.length) throw new Error("Missing Cloudflare Queues: " + missing.join(", "));
          console.log("Verified all six production Queue and DLQ resources.");
          NODE
