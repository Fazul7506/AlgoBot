name: Deploy and activate Cloudflare background workers

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "render.yaml"
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - "render.yaml"

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TASK_DISPATCH_TOKEN: ${{ secrets.CLOUDFLARE_TASK_DISPATCH_TOKEN }}
      CLOUDFLARE_MARKET_STREAM_TOKEN: ${{ secrets.CLOUDFLARE_MARKET_STREAM_TOKEN }}
      MARKET_STREAM_CONTROL_TOKEN: ${{ secrets.MARKET_STREAM_CONTROL_TOKEN }}
      CLOUDFLARE_TRAINING_WEBHOOK_TOKEN: ${{ secrets.CLOUDFLARE_TRAINING_WEBHOOK_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require deployment credentials and matched Django secrets
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_TASK_DISPATCH_TOKEN CLOUDFLARE_MARKET_STREAM_TOKEN MARKET_STREAM_CONTROL_TOKEN CLOUDFLARE_TRAINING_WEBHOOK_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done
          if [[ "${CLOUDFLARE_ACCOUNT_ID}" =~ [^a-fA-F0-9] ]] || [[ ${#CLOUDFLARE_ACCOUNT_ID} -ne 32 ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal Cloudflare account ID."
            exit 1
          fi
          echo "All required secrets are present; values will not be printed."
          echo "The task-dispatch and market-stream tokens must match Render's CLOUDFLARE_TASK_DISPATCH_TOKEN and CLOUDFLARE_MARKET_STREAM_TOKEN."

      - name: Install Worker toolchains
        run: |
          npm install --no-audit --no-fund --prefix cloudflare/background-scheduler
          npm install --no-audit --no-fund --prefix cloudflare/market-stream

      - name: Run source and binding preflight
        run: node cloudflare/preflight.mjs

      - name: Test scheduler
        run: npm --prefix cloudflare/background-scheduler test

      - name: Dry-run all Worker bundles
        run: |
          npx --yes wrangler deploy --dry-run --config cloudflare/ai-training-dispatcher/wrangler.jsonc
          npx --yes wrangler deploy --dry-run --config cloudflare/background-scheduler/wrangler.jsonc
          npx --yes wrangler deploy --dry-run --config cloudflare/market-stream/wrangler.jsonc

      - name: Provision queues and deploy the initial safe configuration
        if: github.event_name != 'pull_request'
        run: bash cloudflare/deploy-safe.sh --apply

      - name: Configure Worker secrets without exposing values
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_TASK_DISPATCH_TOKEN" | npx --yes wrangler secret put ALGOBOT_TASK_DISPATCH_TOKEN --config cloudflare/background-scheduler/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_MARKET_STREAM_TOKEN" | npx --yes wrangler secret put CLOUDFLARE_MARKET_STREAM_TOKEN --config cloudflare/market-stream/wrangler.jsonc
          printf '%s' "$MARKET_STREAM_CONTROL_TOKEN" | npx --yes wrangler secret put MARKET_STREAM_CONTROL_TOKEN --config cloudflare/market-stream/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_TRAINING_WEBHOOK_TOKEN" | npx --yes wrangler secret put AI_TRAINING_WEBHOOK_TOKEN --config cloudflare/ai-training-dispatcher/wrangler.jsonc

      - name: Verify Django endpoints and matching Render secrets before activation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.algobot.dpdns.org"
          symbols="$(mktemp)"
          status="$(curl --silent --show-error --output "$symbols" --write-out "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_MARKET_STREAM_TOKEN" \
            "$api/api/internal/cloudflare/market-symbols/")"
          if [[ "$status" != "200" ]]; then
            echo "::error::Market-symbol endpoint authentication/health check failed (HTTP $status). Workers will not be activated."
            cat "$symbols"
            exit 1
          fi
          SYMBOLS_RESPONSE="$(cat "$symbols")" node - <<'NODE'
          const payload = JSON.parse(process.env.SYMBOLS_RESPONSE || "{}");
          if (!Array.isArray(payload.symbols) || payload.symbols.length === 0) {
            throw new Error("Market-symbol endpoint returned no active symbols");
          }
          console.log(`Verified authenticated active-symbol catalogue: ${payload.symbols.length} symbols`);
          NODE
          dispatch="$(mktemp)"
          status="$(curl --silent --show-error --output "$dispatch" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_TASK_DISPATCH_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"schedule_id":"__deployment_probe__","task":"__invalid__","kwargs":{},"scheduled_minute":0}' \
            "$api/api/internal/cloudflare/task-dispatch/")"
          if [[ "$status" != "400" ]] || ! grep -q '"invalid_payload"' "$dispatch"; then
            echo "::error::Task-dispatch authentication/routing probe failed (HTTP $status). No task was enqueued."
            cat "$dispatch"
            exit 1
          fi
          training="$(mktemp)"
          status="$(curl --silent --show-error --output "$training" --write-out "%{http_code}" \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_TRAINING_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" --data '{"kind":"__deployment_probe__"}' \
            "$api/api/internal/cloudflare/ai-training/")"
          if [[ "$status" != "400" ]] || ! grep -q '"unsupported_kind"' "$training"; then
            echo "::error::Legacy training webhook authentication/routing probe failed (HTTP $status). No task was enqueued."
            cat "$training"
            exit 1
          fi
          echo "Verified authenticated Django endpoints and matching Render-side secrets; invalid probes enqueued no tasks."

      - name: Require a live Celery execution worker before activation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          health="$(mktemp)"
          status="$(curl --silent --show-error --output "$health" --write-out "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_TASK_DISPATCH_TOKEN" \
            "https://api.algobot.dpdns.org/api/internal/cloudflare/task-dispatch/health/")"
          if [[ "$status" != "200" ]]; then
            echo "::error::No live Celery execution worker responded (HTTP $status). Scheduler activation is blocked to prevent queue backlog."
            cat "$health"
            exit 1
          fi
          HEALTH_RESPONSE="$(cat "$health")" node - <<'NODE'
          const payload = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
          if (payload.status !== "ready" || !Number.isInteger(payload.worker_count) || payload.worker_count < 1) {
            throw new Error("Celery execution worker readiness check did not pass");
          }
          console.log(`Verified ${payload.worker_count} live Celery worker(s) before activating schedules`);
          NODE

      - name: Activate the unified scheduler and Deriv market stream
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          npx --yes wrangler deploy --config cloudflare/background-scheduler/wrangler.jsonc --var CLOUDFLARE_SCHEDULER_ACTIVE:true --var ENABLE_EXECUTION_QUEUE_RECOVERY:false
          npx --yes wrangler deploy --config cloudflare/market-stream/wrangler.jsonc --var CLOUDFLARE_MARKET_STREAM_ACTIVE:true
          # Keep the legacy dispatcher's cron gate off to prevent duplicate AI schedules.
          npx --yes wrangler deploy --config cloudflare/ai-training-dispatcher/wrangler.jsonc --var AI_TRAINING_DISPATCH_ACTIVE:false

      - name: Verify deployed Worker settings, bindings, and Queue consumers
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          for worker in algobot-ai-training-dispatcher algobot-background-scheduler algobot-market-stream; do
            response="$(curl --fail --silent --show-error "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings")"
            WORKER_RESPONSE="$response" WORKER_NAME="$worker" node - <<'NODE'
            const payload = JSON.parse(process.env.WORKER_RESPONSE || "{}");
            if (payload.success !== true || !Array.isArray(payload.result?.bindings)) {
              throw new Error(`Could not inspect deployed Worker settings for ${process.env.WORKER_NAME}`);
            }
            const bindings = payload.result.bindings;
            const names = new Set(bindings.map(binding => binding.name));
            if (process.env.WORKER_NAME === "algobot-background-scheduler") {
              for (const name of ["ALGOBOT_TASK_QUEUE", "ALGOBOT_TASK_DLQ_QUEUE", "SCHEDULER_COORDINATOR", "ALGOBOT_TASK_DISPATCH_TOKEN"]) {
                if (!names.has(name)) throw new Error(`Scheduler binding/secret missing: ${name}`);
              }
              for (const [name, expected] of [["CLOUDFLARE_SCHEDULER_ACTIVE", "true"], ["ENABLE_EXECUTION_QUEUE_RECOVERY", "false"]]) {
                const binding = bindings.find(item => item.name === name && item.type === "plain_text");
                if (!binding || binding.text !== expected) throw new Error(`Scheduler activation value incorrect: ${name}`);
              }
            }
            if (process.env.WORKER_NAME === "algobot-market-stream") {
              for (const name of ["MARKET_TICK_QUEUE", "MARKET_TICK_DLQ_QUEUE", "MARKET_STREAM_COORDINATOR", "CLOUDFLARE_MARKET_STREAM_TOKEN", "MARKET_STREAM_CONTROL_TOKEN"]) {
                if (!names.has(name)) throw new Error(`Market-stream binding/secret missing: ${name}`);
              }
              const active = bindings.find(item => item.name === "CLOUDFLARE_MARKET_STREAM_ACTIVE" && item.type === "plain_text");
              if (!active || active.text !== "true") throw new Error("Market stream activation flag is not true");
            }
            if (process.env.WORKER_NAME === "algobot-ai-training-dispatcher") {
              const active = bindings.find(item => item.name === "AI_TRAINING_DISPATCH_ACTIVE" && item.type === "plain_text");
              if (!active || active.text !== "false") throw new Error("Legacy AI dispatcher schedule must remain disabled");
            }
            console.log(`Verified deployed Worker configuration: ${process.env.WORKER_NAME}`);
            NODE
          done
          queues="$(curl --fail --silent --show-error "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues?per_page=1000")"
          QUEUE_RESPONSE="$queues" node - <<'NODE'
          const payload = JSON.parse(process.env.QUEUE_RESPONSE || "{}");
          if (payload.success !== true || !Array.isArray(payload.result)) {
            throw new Error("Cloudflare Queue listing failed");
          }
          const required = [
            ["algobot-ai-training", "algobot-ai-training-dispatcher", "algobot-ai-training-dlq"],
            ["algobot-background-tasks", "algobot-background-scheduler", "algobot-background-tasks-dlq"],
            ["algobot-market-ticks", "algobot-market-stream", "algobot-market-ticks-dlq"],
          ];
          for (const [queueName, workerName, dlqName] of required) {
            const queue = payload.result.find(item => item.queue_name === queueName);
            if (!queue) throw new Error(`Missing Cloudflare Queue: ${queueName}`);
            const consumer = (queue.consumers || []).find(item => item.type === "worker" && item.script_name === workerName);
            if (!consumer) throw new Error(`Queue consumer not attached: ${queueName} -> ${workerName}`);
            if (consumer.dead_letter_queue !== dlqName) throw new Error(`Wrong DLQ for ${queueName}: expected ${dlqName}`);
          }
          const allNames = new Set(payload.result.map(queue => queue.queue_name));
          for (const name of ["algobot-ai-training-dlq", "algobot-background-tasks-dlq", "algobot-market-ticks-dlq"]) {
            if (!allNames.has(name)) throw new Error(`Missing dead-letter Queue: ${name}`);
          }
          console.log("Verified all six Queue/DLQ resources and all three active Worker consumers.");
          NODE
