name: Broker Full Django Suite

on:
  pull_request:
    paths:
      - "apps/brokers/**"
      - "apps/**"
      - "config/**"
      - "manage.py"
      - "requirements/**"
      - ".github/workflows/broker-full-django-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-full-django-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-django-suite:
    name: Full Django test suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_ENV: development
      DJANGO_TESTING: "true"
      USE_REDIS: "false"
      SECRET_KEY: ci-test-secret-key
      CREDENTIALS_ENCRYPTION_KEY: ci-test-credentials-encryption-key
      DEBUG: "True"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
      - name: Compile application sources
        run: python -m compileall -q apps
      - name: Run full Django test suite
        run: python manage.py test --verbosity 1
