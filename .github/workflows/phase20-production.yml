name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_ENV: development
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout current project tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Django system checks
        run: python manage.py check

      - name: Validate frontend structure
        run: python scripts/validate_frontend_structure.py

      - name: Compile every Django template
        run: python scripts/validate_templates.py

      - name: Validate migration graph without generating files
        run: |
          python manage.py makemigrations --check --noinput
          python manage.py showmigrations --plan

      - name: Apply migrations to a clean CI database
        id: migrate
        run: python manage.py migrate --noinput

      - name: Publish migration application diagnostics
        if: failure() && steps.migrate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python manage.py migrate --noinput --verbosity 3 > /tmp/migration-apply.txt 2>&1
          status=$?
          {
            echo '### Clean-database migration application failure'
            echo
            echo "Diagnostic replay exit code: $status"
            echo
            echo '```text'
            tail -n 250 /tmp/migration-apply.txt
            echo '```'
          } > /tmp/migration-apply-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/migration-apply-comment.md
          exit 1

      - name: Run Django test suite
        run: python manage.py test --noinput --parallel 1

      - name: Validate static assets
        run: python manage.py collectstatic --noinput --clear

      - name: Verify icon runtime asset is tracked
        run: test -f static/js/icon_runtime_guard.js

      - name: Verify required production entrypoints
        run: |
          test -f manage.py
          test -f templates/base.html
          test -f templates/broker/connect_broker.html
          test -f static/js/icon_runtime_guard.js
