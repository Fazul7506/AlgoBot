name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_ENV: development
      DJANGO_TESTING: "true"
      USE_REDIS: "false"
      SECRET_KEY: ci-test-secret-key
      CREDENTIALS_ENCRYPTION_KEY: ci-test-credentials-encryption-key
      DEBUG: "True"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout current project tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Set up Node for Cloudflare Worker validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Cloudflare Worker toolchains
        run: |
          npm install --no-audit --no-fund --prefix cloudflare/background-scheduler
          npm install --no-audit --no-fund --prefix cloudflare/market-stream

      - name: Test Cloudflare background scheduler
        run: npm --prefix cloudflare/background-scheduler test

      - name: Dry-run bundle Cloudflare Workers
        run: |
          npm --prefix cloudflare/background-scheduler run check
          npm --prefix cloudflare/market-stream run check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Test Cloudflare Django integration endpoints
        run: |
          python manage.py test apps.ai_engine.test_cloudflare_training_webhook apps.automation.test_cloudflare_hooks apps.automation.test_cloudflare_short_execution apps.market_data.test_cloudflare_hooks --verbosity 2

      - name: Django system checks
        run: python manage.py check

      - name: Validate frontend structure
        run: python scripts/validate_frontend_structure.py

      - name: Generate tracked-file reference audit
        run: python scripts/repository_file_audit.py

      - name: Upload tracked-file reference audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-file-reference-audit-${{ github.run_number }}
          path: audit-output/repository-file-reference-audit.csv
          if-no-files-found: warn
          retention-days: 14

      - name: Compile every Django template
        run: python scripts/validate_templates.py

      - name: Validate migration graph without generating files
        run: |
          python manage.py makemigrations --check --noinput
          python manage.py showmigrations --plan

      - name: Apply migrations to a clean CI database
        id: migrate
        run: python manage.py migrate --noinput

      - name: Publish migration application diagnostics
        if: failure() && steps.migrate.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python manage.py migrate --noinput --verbosity 3 > /tmp/migration-apply.txt 2>&1
          status=$?
          {
            echo '### Clean-database migration application failure'
            echo
            echo "Diagnostic replay exit code: $status"
            echo
            echo '```text'
            tail -n 250 /tmp/migration-apply.txt
            echo '```'
          } > /tmp/migration-apply-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/migration-apply-comment.md
          exit 1

      - name: Verify Django test cache is in-memory
        run: |
          python - <<'PY'
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "deriv_platform.settings")

          import django
          django.setup()

          from django.conf import settings

          backend = settings.CACHES["default"]["BACKEND"]
          channel_backend = settings.CHANNEL_LAYERS["default"]["BACKEND"]
          print(f"DJANGO_TESTING={getattr(settings, 'DJANGO_TESTING', '<unset>')!r}")
          print(f"USE_REDIS={settings.USE_REDIS!r}")
          print(f"CACHE_BACKEND={backend!r}")
          print(f"CHANNEL_BACKEND={channel_backend!r}")
          assert settings.USE_REDIS is False, "Redis must be disabled in Django tests"
          assert backend == "django.core.cache.backends.locmem.LocMemCache", "Django default cache must be LocMemCache"
          assert channel_backend == "channels.layers.InMemoryChannelLayer", "Django channel layer must be in-memory"
          print("Django tests use in-memory cache and channel layer; Redis is disabled.")
          PY

      - name: Run Django test suite
        id: tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          DJANGO_TESTING=true USE_REDIS=false python manage.py test --noinput --parallel 1 2>&1 | tee /tmp/django-tests.txt

      - name: Upload Django test failure log
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: django-test-failure-log-${{ github.run_id }}
          path: /tmp/django-tests.txt
          if-no-files-found: error
          retention-days: 7

      - name: Stop validation after Django test failure
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: exit 1

      - name: Validate static assets
        run: python manage.py collectstatic --noinput --clear

      - name: Verify icon runtime asset is tracked
        run: test -f static/js/icon_runtime_guard.js

      - name: Verify required production entrypoints
        run: |
          test -f manage.py
          test -f Procfile
          test -f templates/base.html
          test -f static/js/icon_runtime_guard.js
