name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_ENV: development
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout current project tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Django system checks
        run: python manage.py check

      - name: Validate frontend structure
        run: python scripts/validate_frontend_structure.py

      - name: Compile every Django template
        run: python scripts/validate_templates.py

      - name: Generate missing Django migrations
        run: |
          python manage.py makemigrations --noinput --verbosity 1
          python manage.py showmigrations --plan

      - name: Persist generated migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -A -- '**/migrations/*.py' '**/migrations/__init__.py'
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: persist generated Django migrations [skip ci]"
            git push
          fi

      - name: Verify migrations are present
        run: |
          python manage.py makemigrations --check --noinput
          python manage.py showmigrations

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run Django test suite
        run: python manage.py test --noinput --parallel 1

      - name: Validate static assets
        run: python manage.py collectstatic --noinput --clear

      - name: Verify icon runtime asset is tracked
        run: test -f static/js/icon_runtime_guard.js

      - name: Verify required production entrypoints
        run: |
          test -f manage.py
          test -f templates/base.html
          test -f templates/broker/connect_broker.html
          test -f static/js/icon_runtime_guard.js
