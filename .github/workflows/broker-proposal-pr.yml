name: Create Reviewed Broker Proposal PR

on:
  workflow_dispatch:
    inputs:
      candidate_slug:
        description: "Reviewed draft slug under apps/brokers/generated_drafts/"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: broker-proposal-pr-${{ inputs.candidate_slug }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_ENV: development
      DJANGO_TESTING: "true"
      USE_REDIS: "false"
      SECRET_KEY: ci-test-secret-key
      CREDENTIALS_ENCRYPTION_KEY: ci-test-credentials-encryption-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Validate slug, draft and reviewed sandbox evidence
        env:
          CANDIDATE_SLUG: ${{ inputs.candidate_slug }}
        run: |
          case "$CANDIDATE_SLUG" in
            (*[!a-z0-9_]*|'') echo "Invalid candidate slug" >&2; exit 2 ;;
          esac
          test "${#CANDIDATE_SLUG}" -ge 2
          test "${#CANDIDATE_SLUG}" -le 48
          DRAFT="apps/brokers/generated_drafts/$CANDIDATE_SLUG"
          test -f "$DRAFT/adapter.py"
          test -f "$DRAFT/test_adapter_contract.py"
          test -f "$DRAFT/README.md"
          test -f "$DRAFT/readiness.json"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
          python scripts/validate_broker_draft.py "$DRAFT"
          EVIDENCE_COMMIT="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit_sha"])' "$DRAFT/readiness.json")"
          git cat-file -e "$EVIDENCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$EVIDENCE_COMMIT" HEAD
          python scripts/validate_broker_readiness.py "$DRAFT/readiness.json" --commit "$EVIDENCE_COMMIT"
          python manage.py test apps.brokers.tests.test_integration_agent apps.brokers.tests.test_integration_validation apps.brokers.tests.test_readiness_gate apps.brokers.tests.test_sandbox_verification --verbosity 2
      - name: Build isolated test image
        run: |
          cat > /tmp/Dockerfile.broker-proposal <<'EOF'
          FROM python:3.13-slim
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PIP_DISABLE_PIP_VERSION_CHECK=1
          WORKDIR /app
          COPY requirements/base.txt /tmp/requirements-base.txt
          RUN python -m pip install --no-cache-dir -r /tmp/requirements-base.txt pytest
          COPY . /app
          EOF
          docker build --pull --no-cache -f /tmp/Dockerfile.broker-proposal -t algobot-broker-proposal:ci .
      - name: Run candidate tests with no network and no credentials
        env:
          CANDIDATE_SLUG: ${{ inputs.candidate_slug }}
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 768m \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --env DJANGO_ENV=development \
            --env DJANGO_TESTING=true \
            --env USE_REDIS=false \
            --env SECRET_KEY=isolated-test-only-secret \
            --env CREDENTIALS_ENCRYPTION_KEY=isolated-test-only-key \
            algobot-broker-proposal:ci \
            python -m pytest -q "apps/brokers/generated_drafts/$CANDIDATE_SLUG/test_adapter_contract.py"

  create-proposal:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy approved files to a non-registered proposal directory
        env:
          CANDIDATE_SLUG: ${{ inputs.candidate_slug }}
          SOURCE_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "$SOURCE_REF"
          git checkout "origin/$SOURCE_REF" -- \
            "apps/brokers/generated_drafts/$CANDIDATE_SLUG/adapter.py" \
            "apps/brokers/generated_drafts/$CANDIDATE_SLUG/test_adapter_contract.py" \
            "apps/brokers/generated_drafts/$CANDIDATE_SLUG/README.md" \
            "apps/brokers/generated_drafts/$CANDIDATE_SLUG/readiness.json"
          mkdir -p "apps/brokers/adapters/proposals/$CANDIDATE_SLUG"
          cp "apps/brokers/generated_drafts/$CANDIDATE_SLUG/adapter.py" "apps/brokers/adapters/proposals/$CANDIDATE_SLUG/adapter.py"
          cp "apps/brokers/generated_drafts/$CANDIDATE_SLUG/test_adapter_contract.py" "apps/brokers/adapters/proposals/$CANDIDATE_SLUG/test_adapter_contract.py"
          cp "apps/brokers/generated_drafts/$CANDIDATE_SLUG/README.md" "apps/brokers/adapters/proposals/$CANDIDATE_SLUG/README.md"
          cp "apps/brokers/generated_drafts/$CANDIDATE_SLUG/readiness.json" "apps/brokers/adapters/proposals/$CANDIDATE_SLUG/readiness.json"
          git rm -r "apps/brokers/generated_drafts/$CANDIDATE_SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PROPOSAL_BRANCH="broker-proposal/$CANDIDATE_SLUG-$GITHUB_RUN_ID"
          git checkout -b "$PROPOSAL_BRANCH"
          git add "apps/brokers/adapters/proposals/$CANDIDATE_SLUG"
          git commit -m "Propose reviewed broker adapter: $CANDIDATE_SLUG"
          git push origin "$PROPOSAL_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$PROPOSAL_BRANCH" \
            --draft --title "[Draft] Propose broker adapter: $CANDIDATE_SLUG" \
            --body "Automated proposal only. Static checks, isolated contract tests, sandbox evidence, and recorded human review were required by the workflow. This PR does not register or enable the broker. Maintainers must inspect the diff and re-run CI. Unknown order outcomes must be reconciled before resubmission."
