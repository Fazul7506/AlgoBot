name: Frontend Hardening

on:
  push:
    branches: [main, 'refactor/frontend-hardening']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Run frontend hygiene audit
        run: python scripts/frontend_audit.py

      - name: Set up Node.js for market icon contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate official market icon registry contract
        run: node static/js/market_asset_registry.test.js
      - name: Validate preferences runtime and WCAG theme contracts
        run: node static/js/core/preferences_runtime.test.js
      - name: Validate shared market-data stream and bid/ask provenance
        run: node static/js/core/market_data_provenance.test.js

      - name: Validate Django templates
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python manage.py check

      - name: Validate static asset references
        run: |
          python manage.py collectstatic --noinput --clear
          test -f staticfiles/css/base_shell.css
          test -f staticfiles/js/base_shell.js
