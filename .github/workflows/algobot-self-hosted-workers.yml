name: AlgoBot self-hosted background runtime

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algobot-self-hosted-background-runtime
  cancel-in-progress: true

jobs:
  background-runtime:
    name: Run AlgoBot Celery + market workers
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 350

    env:
      DJANGO_ENV: production
      USE_REDIS: "true"
      USE_CELERY: "true"
      PYTHONUNBUFFERED: "1"
      CELERY_BROKER_URL: ${{ secrets.REDIS_URL }}
      CELERY_RESULT_BACKEND: ${{ secrets.REDIS_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - name: Checkout AlgoBot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify required runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL REDIS_URL SECRET_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install AlgoBot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Django system check
        run: |
          python manage.py check

      - name: Start AlgoBot background processes
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            trap - EXIT
            kill "${BEAT_PID:-}" "${WORKER_PID:-}" "${MARKET_WORKER_PID:-}" "${STREAM_PID:-}" 2>/dev/null || true
            wait "${BEAT_PID:-}" "${WORKER_PID:-}" "${MARKET_WORKER_PID:-}" "${STREAM_PID:-}" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          python manage.py migrate --fake-initial --noinput

          celery -A deriv_platform.celery beat \
            --loglevel=INFO \
            --pidfile=/tmp/algobot-celerybeat.pid &
          BEAT_PID=$!

          celery -A deriv_platform.celery worker \
            --loglevel=INFO \
            -Q celery \
            --concurrency=2 \
            --prefetch-multiplier=1 \
            --max-tasks-per-child=100 \
            --hostname=general@%h &
          WORKER_PID=$!

          python manage.py check_market_data_worker &
          MARKET_PREFLIGHT_PID=$!
          wait "$MARKET_PREFLIGHT_PID"

          celery -A deriv_platform.celery worker \
            --loglevel=INFO \
            --include=apps.market_data.tasks \
            --queues=market_data \
            --concurrency=1 \
            --prefetch-multiplier=1 \
            --max-tasks-per-child=20 \
            --hostname=market-data@%h &
          MARKET_WORKER_PID=$!

          python manage.py run_market_stream &
          STREAM_PID=$!

          echo "AlgoBot background runtime started."
          echo "PIDs: beat=$BEAT_PID worker=$WORKER_PID market_worker=$MARKET_WORKER_PID stream=$STREAM_PID"

          while true; do
            for pid in "$BEAT_PID" "$WORKER_PID" "$MARKET_WORKER_PID" "$STREAM_PID"; do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "::error::AlgoBot background process exited unexpectedly (pid=$pid)."
                exit 1
              fi
            done
            sleep 20
          done
