name: Rebuild All Django Migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-all-django-migrations
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: development
      SECRET_KEY: ci-migration-rebuild-key
      DEBUG: "True"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Remove stale project migration files
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "deriv_platform.settings")
          django.setup()
          from django.apps import apps

          django_apps = {"admin", "auth", "contenttypes", "sessions", "messages", "staticfiles"}
          removed = []
          for config in apps.get_app_configs():
              if config.label in django_apps:
                  continue
              migration_dir = Path(config.path) / "migrations"
              if not migration_dir.exists():
                  migration_dir.mkdir(parents=True, exist_ok=True)
              init = migration_dir / "__init__.py"
              init.touch(exist_ok=True)
              for path in migration_dir.glob("*.py"):
                  if path.name != "__init__.py":
                      path.unlink()
                      removed.append(str(path))
          print(f"Removed {len(removed)} stale project migration files.")
          for path in removed:
              print(path)
          PY

      - name: Generate complete initial migrations for every model-bearing app
        run: |
          python manage.py makemigrations --noinput --verbosity 1
          python manage.py makemigrations --check --noinput

      - name: Verify every model-bearing app has migrations
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "deriv_platform.settings")
          django.setup()
          from django.apps import apps

          failures = []
          for config in apps.get_app_configs():
              if config.name.startswith("django."):
                  continue
              models = list(config.get_models())
              if not models:
                  continue
              migration_dir = Path(config.path) / "migrations"
              migrations = [p for p in migration_dir.glob("*.py") if p.name != "__init__.py"] if migration_dir.exists() else []
              print(f"{config.label}: {len(models)} models, {len(migrations)} migrations")
              if not migrations:
                  failures.append(config.label)
          if failures:
              raise SystemExit("Missing migrations for model-bearing apps: " + ", ".join(failures))
          PY
          python manage.py showmigrations

      - name: Persist all migrations to main
        run: |
          git add -A -- '**/migrations/*.py' '**/migrations/__init__.py'
          if git diff --cached --quiet; then
            echo "No migration changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: rebuild complete Django migration graph [skip ci]"
            git push origin HEAD:main
          fi
