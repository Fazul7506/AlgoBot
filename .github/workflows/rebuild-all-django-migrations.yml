name: Validate Django Migrations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-django-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: development
      SECRET_KEY: ci-migration-validation-key
      DEBUG: "True"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Validate migration graph without rewriting it
        id: migration_validation
        run: |
          python manage.py makemigrations --check --noinput --verbosity 1
          python manage.py showmigrations --plan
          python manage.py check --deploy

      - name: Publish migration drift diagnostics
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Django migration validation failure'
            echo
            echo 'The following output shows what Django would generate without modifying the repository:'
            echo
            echo '```text'
            python manage.py makemigrations --dry-run --noinput --verbosity 3 || true
            echo '```'
          } > /tmp/migration-drift.txt
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/migration-drift.txt

      - name: Verify migration files are tracked
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "deriv_platform.settings")
          import django
          django.setup()
          from django.apps import apps

          failures = []
          for config in apps.get_app_configs():
              if config.name.startswith("django."):
                  continue
              if not list(config.get_models()):
                  continue
              migration_dir = Path(config.path) / "migrations"
              migrations = [p for p in migration_dir.glob("*.py") if p.name != "__init__.py"] if migration_dir.exists() else []
              print(f"{config.label}: {len(migrations)} migration file(s)")
              if not migrations:
                  failures.append(config.label)
          if failures:
              raise SystemExit("Missing migrations for model-bearing apps: " + ", ".join(failures))
          PY

      # This workflow intentionally NEVER deletes, regenerates, commits, or pushes
      # migration files. Production migration history must remain immutable.
