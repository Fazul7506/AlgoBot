name: Provider-Specific Broker Sandbox Lifecycle Verification

on:
  workflow_dispatch:
    inputs:
      broker_slug:
        description: "Reviewed broker slug under apps/brokers/sandbox_harnesses/"
        required: true
        type: string
      candidate_commit:
        description: "Full 40-character SHA containing the reviewed adapter"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: broker-sandbox-lifecycle-${{ inputs.broker_slug }}
  cancel-in-progress: false

jobs:
  verify-sandbox-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: broker-sandbox-${{ inputs.broker_slug }}
    env:
      BROKER_TARGET_ENVIRONMENT: sandbox
      BROKER_SANDBOX_API_TOKEN: ${{ secrets.BROKER_SANDBOX_API_TOKEN || secrets.DERIV_DEMO_TOKEN }}
      BROKER_SANDBOX_APP_ID: ${{ secrets.BROKER_SANDBOX_APP_ID || vars.DERIV_APP_ID }}
      BROKER_SANDBOX_CLIENT_ID: ${{ secrets.BROKER_SANDBOX_CLIENT_ID }}
      BROKER_SANDBOX_CLIENT_SECRET: ${{ secrets.BROKER_SANDBOX_CLIENT_SECRET }}
      DERIV_DEMO_SYMBOL: ${{ vars.DERIV_DEMO_SYMBOL || 'R_100' }}
      DERIV_DEMO_STAKE: ${{ vars.DERIV_DEMO_STAKE || '1' }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Validate inputs and trusted harness exists
        env:
          BROKER_SLUG: ${{ inputs.broker_slug }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          case "$BROKER_SLUG" in
            (*[!a-z0-9_]*|'') echo "Invalid broker slug" >&2; exit 2 ;;
          esac
          test "${#BROKER_SLUG}" -ge 2
          test "${#BROKER_SLUG}" -le 48
          case "$CANDIDATE_COMMIT" in
            (*[!0-9a-f]*|'') echo "Commit must be a full lowercase SHA" >&2; exit 2 ;;
          esac
          test "${#CANDIDATE_COMMIT}" -eq 40
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          test -f "apps/brokers/sandbox_harnesses/$BROKER_SLUG.py"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
      - name: Run trusted sandbox lifecycle checks
        env:
          BROKER_SLUG: ${{ inputs.broker_slug }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          python scripts/run_broker_sandbox_verification.py \
            --broker-slug "$BROKER_SLUG" \
            --commit "$CANDIDATE_COMMIT" \
            --output sandbox-readiness.json
      - name: Upload sanitized evidence (even on failed checks)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-sandbox-evidence-${{ inputs.broker_slug }}-${{ github.run_id }}
          path: sandbox-readiness.json
          if-no-files-found: warn
          retention-days: 30
      - name: Explain approval boundary
        if: always()
        run: |
          {
            echo "## Broker sandbox lifecycle"
            echo "- Only trusted provider harness code on main is executed."
            echo "- Generated adapter code is not run with credentials by this workflow."
            echo "- Credentials are scoped to the broker sandbox environment and must be demo-only."
            echo "- This workflow never registers, activates, deploys, or enables live trading."
            echo "- A maintainer must review the evidence artifact, record approval, and pass the separate readiness gate."
          } >> "$GITHUB_STEP_SUMMARY"
