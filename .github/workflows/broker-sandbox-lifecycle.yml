name: Provider-Specific Broker Sandbox Lifecycle Verification

on:
  workflow_dispatch:
    inputs:
      broker_slug:
        description: "Reviewed trusted harness slug"
        required: true
        type: string
      candidate_pr_number:
        description: "PR number containing candidate commit"
        required: true
        type: string
      candidate_commit:
        description: "Full 40-character candidate commit SHA"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: broker-sandbox-lifecycle-${{ inputs.broker_slug }}
  cancel-in-progress: false

jobs:
  verify-sandbox-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: broker-sandbox-${{ inputs.broker_slug }}
    env:
      BROKER_TARGET_ENVIRONMENT: sandbox
      BROKER_SANDBOX_API_TOKEN: ${{ secrets.BROKER_SANDBOX_API_TOKEN || secrets.DERIV_DEMO_TOKEN }}
      BROKER_SANDBOX_APP_ID: ${{ secrets.BROKER_SANDBOX_APP_ID || vars.DERIV_APP_ID }}
      BROKER_SANDBOX_CLIENT_ID: ${{ secrets.BROKER_SANDBOX_CLIENT_ID }}
      BROKER_SANDBOX_CLIENT_SECRET: ${{ secrets.BROKER_SANDBOX_CLIENT_SECRET }}
      DERIV_DEMO_SYMBOL: ${{ vars.DERIV_DEMO_SYMBOL || 'R_100' }}
      DERIV_DEMO_STAKE: ${{ vars.DERIV_DEMO_STAKE || '1' }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Validate candidate and trusted harness
        env:
          BROKER_SLUG: ${{ inputs.broker_slug }}
          CANDIDATE_PR_NUMBER: ${{ inputs.candidate_pr_number }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          set -euo pipefail
          case "$BROKER_SLUG" in (*[!a-z0-9_]*|'') echo "Invalid broker slug" >&2; exit 2 ;; esac
          test "${#BROKER_SLUG}" -ge 2
          test "${#BROKER_SLUG}" -le 48
          case "$CANDIDATE_PR_NUMBER" in (*[!0-9]*|'') echo "Invalid PR number" >&2; exit 2 ;; esac
          case "$CANDIDATE_COMMIT" in (*[!0-9a-f]*|'') echo "Invalid commit SHA" >&2; exit 2 ;; esac
          test "${#CANDIDATE_COMMIT}" -eq 40
          git fetch --no-tags origin "refs/pull/$CANDIDATE_PR_NUMBER/head"
          git cat-file -e "$CANDIDATE_COMMIT^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_COMMIT" FETCH_HEAD
          test -f "apps/brokers/sandbox_harnesses/$BROKER_SLUG.py"
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
      - name: Run trusted sandbox lifecycle checks
        env:
          BROKER_SLUG: ${{ inputs.broker_slug }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          python scripts/run_broker_sandbox_verification.py \
            --broker-slug "$BROKER_SLUG" \
            --commit "$CANDIDATE_COMMIT" \
            --output sandbox-readiness.json
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-sandbox-evidence-${{ inputs.broker_slug }}-${{ github.run_id }}
          path: sandbox-readiness.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record safety boundary
        if: always()
        run: |
          {
            echo "Only trusted harness code from main executes with demo credentials."
            echo "Candidate adapter code is never imported or executed by this workflow."
            echo "This workflow does not enable live trading."
            echo "Review the evidence artifact before readiness approval."
          } >> "$GITHUB_STEP_SUMMARY"
