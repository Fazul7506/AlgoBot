name: Generate and Validate Broker Onboarding Draft

on:
  workflow_dispatch:
    inputs:
      broker_slug:
        description: "Safe lowercase candidate slug"
        required: true
        type: string
      provider_name:
        description: "Broker/provider display name"
        required: true
        type: string
      api_docs:
        description: "Official API documentation or accurate API summary (minimum 80 characters)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: broker-onboarding-${{ inputs.broker_slug }}
  cancel-in-progress: false

jobs:
  generate-validate-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: development
      DJANGO_TESTING: "true"
      USE_REDIS: "false"
      SECRET_KEY: ci-test-secret-key
      CREDENTIALS_ENCRYPTION_KEY: ci-test-credentials-encryption-key
      DEBUG: "True"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BROKER_SLUG: ${{ inputs.broker_slug }}
      BROKER_PROVIDER_NAME: ${{ inputs.provider_name }}
      BROKER_API_DOCS: ${{ inputs.api_docs }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt pytest
      - name: Generate untrusted draft and run static gate
        run: |
          python scripts/generate_broker_draft.py
          python scripts/validate_broker_draft.py "apps/brokers/generated_drafts/$BROKER_SLUG"
      - name: Run focused broker integration tests
        run: |
          python manage.py test \
            apps.brokers.tests.test_integration_agent \
            apps.brokers.tests.test_integration_validation \
            apps.brokers.tests.test_readiness_gate \
            apps.brokers.tests.test_sandbox_verification --verbosity 2
      - name: Run generated contract tests in isolated no-network container
        run: |
          DRAFT="apps/brokers/generated_drafts/$BROKER_SLUG"
          test -f "$DRAFT/adapter.py"
          test -f "$DRAFT/test_adapter_contract.py"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path("apps/brokers/generated_drafts") / os.environ["BROKER_SLUG"]
          allowed = {"adapter.py", "test_adapter_contract.py", "README.md"}
          if any(p.is_symlink() or not p.is_file() or p.name not in allowed for p in root.iterdir()):
              raise SystemExit("Candidate contains an unapproved file or non-regular entry.")
          PY
          cat > /tmp/Dockerfile.broker-draft <<'EOF'
          FROM python:3.13-slim
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PIP_DISABLE_PIP_VERSION_CHECK=1
          WORKDIR /candidate
          RUN python -m pip install --no-cache-dir pytest
          COPY apps/brokers/generated_drafts/$BROKER_SLUG/ /candidate/
          USER 65532:65532
          CMD ["pytest", "-q", "test_adapter_contract.py"]
          EOF
          docker build --pull --no-cache --build-arg BROKER_SLUG="$BROKER_SLUG" -f /tmp/Dockerfile.broker-draft -t algobot-broker-candidate .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 512m --cpus 1 algobot-broker-candidate
      - name: Create reviewable draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="bot/broker-onboarding-$BROKER_SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "apps/brokers/generated_drafts/$BROKER_SLUG"
          git commit -m "Add generated broker adapter draft: $BROKER_SLUG"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Draft broker integration: $BROKER_PROVIDER_NAME" \
            --body-file <(cat <<EOF
          ## Automated broker onboarding candidate

          - Candidate: `$BROKER_SLUG`
          - Provider: $BROKER_PROVIDER_NAME
          - Generation, static validation, focused broker tests, and isolated contract tests completed in this workflow.
          - Generated source remains untrusted and is not imported by the application.
          - **Sandbox lifecycle verification is not claimed by this PR.** A maintainer must review the adapter and a trusted provider-specific harness must verify authentication, demo account identity, market data, order submission, cancellation/close semantics, fills, and ambiguous-execution reconciliation.
          - No broker registration, production enablement, deployment, or live trading is performed.
          - Do not add credentials or raw account/provider responses to this PR.
          EOF
          )
      - name: Summarize safe stopping point
        if: always()
        run: |
          {
            echo "## Broker onboarding pipeline"
            echo "- Generation and static validation run before isolated execution."
            echo "- Generated contract tests run without network, secrets, write access, or Linux capabilities."
            echo "- PR remains a draft; registration and production activation are not performed."
            echo "- Sandbox trade lifecycle requires a reviewed, provider-specific trusted harness and demo credentials."
          } >> "$GITHUB_STEP_SUMMARY"
