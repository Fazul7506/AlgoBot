name: Chromium Visual Smoke

# Repository-wide browser smoke coverage:
# - Every branch push gets a Chromium run against the deployed AlgoBot site.
# - Every PR targeting main gets a run as well (including draft PR updates).
# - Manual runs remain available from the Actions tab.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chromium-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture desktop, tablet, and mobile screenshots
        env:
          # Only the web application URL belongs here. The API hostname is a
          # separate service and must not be used as the browser base URL.
          ALGOBOT_VISUAL_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://algobot-pr-{0}.onrender.com', github.event.pull_request.number) || secrets.ALGOBOT_VISUAL_BASE_URL || 'https://algobot.dpdns.org' }}
          ALGOBOT_VISUAL_USERNAME: ${{ secrets.ALGOBOT_VISUAL_USERNAME }}
          ALGOBOT_VISUAL_PASSWORD: ${{ secrets.ALGOBOT_VISUAL_PASSWORD }}
          ALGOBOT_VISUAL_TOTP_SECRET: ${{ secrets.ALGOBOT_VISUAL_TOTP_SECRET }}
          ALGOBOT_VISUAL_PATHS: ${{ vars.ALGOBOT_VISUAL_PATHS || '/notifications/,/security/,/analysis/' }}
        run: node scripts/visual_smoke.mjs

      - name: Upload Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algobot-chromium-screenshots-${{ github.run_number }}
          path: artifacts/chromium/
          if-no-files-found: warn
          retention-days: 14
