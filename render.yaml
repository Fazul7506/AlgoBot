services:
  - type: web
    name: AlgoBot
    runtime: python
    plan: starter
    domains:
      - algobot.dpdns.org
      - api.algobot.dpdns.org
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: ALGO_API_BASE_URL
        value: https://api.algobot.dpdns.org
      - key: BASE_URL
        value: https://algobot.dpdns.org
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: CORS_ALLOWED_ORIGINS
        value: https://algobot.dpdns.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://algobot.dpdns.org
      - key: SESSION_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: CSRF_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: Lax
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt && DJANGO_ENV=production python manage.py collectstatic --noinput
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && python manage.py set_telegram_webhook && exec daphne --bind 0.0.0.0 --port $PORT deriv_platform.asgi:application
    healthCheckPath: /health/
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit

  - type: worker
    name: AlgoBot-Worker
    runtime: python
    plan: starter
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt
    autoDeployTrigger: commit
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && CELERY_BROKER_URL="$REDIS_URL" CELERY_RESULT_BACKEND="$REDIS_URL" exec celery -A deriv_platform worker --loglevel=INFO -Q celery --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=100 --hostname=general@%h
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_BOT_USERNAME
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_USERNAME
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: DATABASE_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: USE_REDIS
        fromService:
          name: AlgoBot
          type: web
          envVarKey: USE_REDIS
      - key: USE_CELERY
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_WORKER_BROKER_RETRY
        value: "true"
      - key: CELERY_WORKER_RETRY_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        fromService:
          name: AlgoBot
          type: web
          envVarKey: SECRET_KEY

  - type: worker
    name: AlgoBot-Beat
    runtime: python
    plan: starter
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt
    autoDeployTrigger: commit
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && CELERY_BROKER_URL="$REDIS_URL" CELERY_RESULT_BACKEND="$REDIS_URL" exec celery -A deriv_platform beat --loglevel=INFO --pidfile=/tmp/algobot-celerybeat.pid
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_BOT_USERNAME
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_USERNAME
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: DATABASE_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: USE_REDIS
        fromService:
          name: AlgoBot
          type: web
          envVarKey: USE_REDIS
      - key: USE_CELERY
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_WORKER_BROKER_RETRY
        value: "true"
      - key: CELERY_WORKER_RETRY_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        fromService:
          name: AlgoBot
          type: web
          envVarKey: SECRET_KEY

  - type: worker
