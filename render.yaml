      - key: TELEGRAM_BOT_USERNAME
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_USERNAME
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: DATABASE_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: USE_REDIS
        fromService:
          name: AlgoBot
          type: web
          envVarKey: USE_REDIS
      - key: SECRET_KEY
        fromService:
          name: AlgoBot
          type: web
          envVarKey: SECRET_KEY

  - type: worker
