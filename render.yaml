    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && CELERY_BROKER_URL="$REDIS_URL" CELERY_RESULT_BACKEND="$REDIS_URL" exec celery -A deriv_platform worker --loglevel=INFO -Q market_data --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=20 --hostname=market-data@%h
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_ENV
