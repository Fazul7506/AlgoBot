# Render's native Python services read the repository-root .python-version (3.13.15).
services:
  - type: web
    name: AlgoBot
    runtime: python
    # Match the currently configured free service; do not silently upgrade the
    # Blueprint to a paid instance. Free instances are not always-on.
    plan: free
    domains:
      - algobot.dpdns.org
      - api.algobot.dpdns.org
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: ALGOBOT_SPLASH_ENABLED
        value: "false"
      - key: ALGOBOT_SPLASH_PATHS_JSON
        value: '["/"]'
      - key: ALGOBOT_SPLASH_START_AT
        value: ""
      - key: ALGOBOT_SPLASH_END_AT
        value: ""
      - key: ALGOBOT_SPLASH_REPEAT
        value: session
      - key: ALGOBOT_SPLASH_DURATION_MS
        value: "8200"
      - key: ALGOBOT_SPLASH_TYPE_SPEED_MS
        value: "42"
      - key: ALGOBOT_SPLASH_DELETE_SPEED_MS
        value: "22"
      - key: ALGOBOT_SPLASH_NAME
        value: "Mäh Qűěěñ ❤️"
      - key: ALGOBOT_SPLASH_PHONE
        value: "0141 322612"
      - key: ALGOBOT_SPLASH_SIGNATURE
        value: "With love, AlgoBot ❤️"
      - key: ALGOBOT_SPLASH_SIDE_LEFT
        value: "Always & Forever ❤️"
      - key: ALGOBOT_SPLASH_SIDE_RIGHT
        value: "I'm lucky to have you... 💕"
      - key: ALGOBOT_SPLASH_TAGLINE
        value: "Smarter trades · brighter futures · a little more love"
      - key: ALGOBOT_SPLASH_MESSAGES_JSON
        value: '[ "You''re not just a user...", "You''re my favourite person in this journey.", "Your smile, your voice, your presence...", "Everything about you makes my world brighter. ❤️" ]'
      - key: ALGOBOT_SPLASH_EMOJIS_JSON
        value: '[ "❤️", "💖", "💕", "💗", "💘", "💝", "😍", "😘", "🌹", "✨", "💋", "👑" ]'
      - key: ALGOBOT_SPLASH_PARTICLES_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_CONFETTI_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_ROSES_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_COUNTDOWN_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_SOUND_ENABLED
        value: "false"
      - key: ALGOBOT_SPLASH_CELEBRATION_DURATION_MS
        value: "3200"
      - key: ALGOBOT_SPLASH_TRANSITION_STYLE
        value: cinematic
      - key: ALGOBOT_SPLASH_INTENSITY
        value: high
      - key: ALGOBOT_SPLASH_MEMORY_MESSAGE
        value: "Before the charts. Before the strategies. Before the trades. There was you. ❤️"
      - key: ALGOBOT_SPLASH_FINAL_MESSAGE
        value: "This little world was made just for you."
      - key: ALGOBOT_SPLASH_READY_MESSAGE
        value: "Ready, my queen?"
      - key: ALGOBOT_SPLASH_PROCEED_LABEL
        value: "ENTER ALGOBOT ❤️"
      - key: ALGOBOT_SPLASH_AUTO_PROCEED
        value: "true"
      - key: ALGO_API_BASE_URL
        value: https://api.algobot.dpdns.org
      - key: BASE_URL
        value: https://algobot.dpdns.org
      - key: TELEGRAM_MODE
        value: webhook
      - key: CORS_ALLOWED_ORIGINS
        value: https://algobot.dpdns.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://algobot.dpdns.org
      - key: SESSION_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: CSRF_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: Lax
      - key: AI_MODEL_PREFIX
        value: algobot/models
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        value: algobot-model-artifacts
      - key: AI_MODEL_SIGNING_KEY
        sync: false
      - key: CLOUDFLARE_TRAINING_WEBHOOK_TOKEN
        sync: false
      - key: AI_SENTIMENT_RSS_URLS
        sync: false
      - key: AI_SENTIMENT_SYMBOL_KEYWORDS_JSON
        sync: false
      - key: ORDER_BOOK_API_URL
        sync: false
      - key: ORDER_BOOK_API_TOKEN
        sync: false
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt && DJANGO_ENV=production python manage.py collectstatic --noinput
    # Run database migrations before the new web instance receives traffic.
    # Keep network-dependent Telegram registration out of the web start path so
    # a provider timeout cannot leave the HTTP service unavailable during deploys.
    preDeployCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate_locked --fake-initial --noinput
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && bash deploy/web/start.sh
    healthCheckPath: /health/
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit
