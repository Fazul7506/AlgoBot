services:
  - type: web
    name: AlgoBot
    runtime: python
    plan: starter
    domains:
      - algobot.dpdns.org
      - api.algobot.dpdns.org
    envVars:
      - key: DJANGO_ENV
        value: production
      # Romantic pre-home experience: all presentation code stays in GitHub;
      # Render environment variables control activation, timing and content.
      - key: ALGOBOT_SPLASH_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_PATHS_JSON
        value: '["/"]'
      - key: ALGOBOT_SPLASH_START_AT
        value: ""
      - key: ALGOBOT_SPLASH_END_AT
        value: ""
      - key: ALGOBOT_SPLASH_REPEAT
        value: session
      - key: ALGOBOT_SPLASH_DURATION_MS
        value: "8200"
      - key: ALGOBOT_SPLASH_TYPE_SPEED_MS
        value: "42"
      - key: ALGOBOT_SPLASH_DELETE_SPEED_MS
        value: "22"
      - key: ALGOBOT_SPLASH_NAME
        value: "Mäh Qűěěñ ❤️"
      - key: ALGOBOT_SPLASH_PHONE
        value: "0141 322612"
      - key: ALGOBOT_SPLASH_SIGNATURE
        value: "With love, AlgoBot ❤️"
      - key: ALGOBOT_SPLASH_SIDE_LEFT
        value: "Always & Forever ❤️"
      - key: ALGOBOT_SPLASH_SIDE_RIGHT
        value: "I'm lucky to have you... 💕"
      - key: ALGOBOT_SPLASH_TAGLINE
        value: "Smarter trades · brighter futures · a little more love"
      - key: ALGOBOT_SPLASH_MESSAGES_JSON
        value: '[ "You''re not just a user...", "You''re my favourite person in this journey.", "Your smile, your voice, your presence...", "Everything about you makes my world brighter. ❤️" ]'
      - key: ALGOBOT_SPLASH_EMOJIS_JSON
        value: '[ "❤️", "💖", "💕", "💗", "💘", "💝", "😍", "😘", "🌹", "✨", "💋", "👑" ]'
      - key: ALGOBOT_SPLASH_PARTICLES_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_CONFETTI_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_ROSES_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_COUNTDOWN_ENABLED
        value: "true"
      - key: ALGOBOT_SPLASH_SOUND_ENABLED
        value: "false"
      - key: ALGOBOT_SPLASH_CELEBRATION_DURATION_MS
        value: "3200"
      - key: ALGOBOT_SPLASH_TRANSITION_STYLE
        value: cinematic
      - key: ALGOBOT_SPLASH_INTENSITY
        value: high
      - key: ALGOBOT_SPLASH_MEMORY_MESSAGE
        value: "Before the charts. Before the strategies. Before the trades. There was you. ❤️"
      - key: ALGOBOT_SPLASH_FINAL_MESSAGE
        value: "This little world was made just for you."
      - key: ALGOBOT_SPLASH_READY_MESSAGE
        value: "Ready, my queen?"
      - key: ALGOBOT_SPLASH_PROCEED_LABEL
        value: "ENTER ALGOBOT ❤️"
      - key: ALGOBOT_SPLASH_AUTO_PROCEED
        value: "true"
      - key: ALGO_API_BASE_URL
        value: https://api.algobot.dpdns.org
      - key: BASE_URL
        value: https://algobot.dpdns.org
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: CORS_ALLOWED_ORIGINS
        value: https://algobot.dpdns.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://algobot.dpdns.org
      - key: SESSION_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: CSRF_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: Lax
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt && DJANGO_ENV=production python manage.py collectstatic --noinput
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && python manage.py set_telegram_webhook && exec daphne --bind 0.0.0.0 --port $PORT deriv_platform.asgi:application
    healthCheckPath: /health/
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit

  - type: worker
    name: AlgoBot-Worker
    runtime: python
    plan: starter
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt
    autoDeployTrigger: commit
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && CELERY_BROKER_URL="$REDIS_URL" CELERY_RESULT_BACKEND="$REDIS_URL" exec celery -A deriv_platform.celery worker --loglevel=INFO -Q celery --concurrency=2 --prefetch-multiplier=1 --max-tasks-per-child=100 --hostname=general@%h
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_BOT_USERNAME
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_USERNAME
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: DATABASE_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: USE_REDIS
        fromService:
          name: AlgoBot
          type: web
          envVarKey: USE_REDIS
      - key: USE_CELERY
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_WORKER_BROKER_RETRY
        value: "true"
      - key: CELERY_WORKER_RETRY_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        fromService:
          name: AlgoBot
          type: web
          envVarKey: SECRET_KEY


  - type: worker
    name: AlgoBot-MarketData-Worker
    runtime: python
    plan: starter
    buildCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && pip install -r requirements/base.txt
    autoDeployTrigger: commit
    startCommand: export PATH="$PWD/bin:${VENV_ROOT:-/opt/render/project/src/.venv}/bin:$PATH" && DJANGO_ENV=production python manage.py migrate --fake-initial --noinput && CELERY_BROKER_URL="$REDIS_URL" CELERY_RESULT_BACKEND="$REDIS_URL" python manage.py check_market_data_worker && CELERY_BROKER_URL="$REDIS_URL" CELERY_RESULT_BACKEND="$REDIS_URL" exec celery -A deriv_platform.celery worker --loglevel=INFO -Q market_data --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=20 --hostname=market-data@%h
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_BOT_USERNAME
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_USERNAME
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: DATABASE_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: USE_REDIS
        fromService:
          name: AlgoBot
          type: web
          envVarKey: USE_REDIS
      - key: USE_CELERY
        value: "true"
      - key: CELERY_BROKER_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: CELERY_WORKER_BROKER_RETRY
        value: "true"
      - key: CELERY_WORKER_RETRY_ON_STARTUP
        value: "true"
      - key: SECRET_KEY
        fromService:
          name: AlgoBot
          type: web
          envVarKey: SECRET_KEY


