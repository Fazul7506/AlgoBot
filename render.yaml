services:
  - type: web
    name: AlgoBot
    runtime: python
    plan: starter
    domains:
      - algobot.dpdns.org
      - api.algobot.dpdns.org
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: ALGO_API_BASE_URL
        value: https://api.algobot.dpdns.org
      - key: BASE_URL
        value: https://algobot.dpdns.org
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: CORS_ALLOWED_ORIGINS
        value: https://algobot.dpdns.org
      - key: CSRF_TRUSTED_ORIGINS
        value: https://algobot.dpdns.org
      - key: SESSION_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: CSRF_COOKIE_DOMAIN
        value: .algobot.dpdns.org
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: Lax
    buildCommand: python3 -m pip install -r requirements.txt && python3 manage.py check && python3 manage.py makemigrations --check --dry-run && python3 manage.py migrate --noinput && python3 manage.py seed_markets && python3 manage.py set_telegram_webhook && python3 manage.py collectstatic --noinput
    startCommand: DJANGO_ENV=production exec daphne --bind 0.0.0.0 --port $PORT deriv_platform.asgi:application
    healthCheckPath: /health/
    maxShutdownDelaySeconds: 60
    autoDeploy: true

  - type: worker
    name: AlgoBot-Worker
    runtime: python
    plan: starter
    buildCommand: python3 -m pip install -r requirements/production.txt
    startCommand: DJANGO_ENV=production python3 manage.py migrate --fake-initial --noinput && exec celery -A deriv_platform worker --beat --loglevel=INFO --concurrency=2 --max-tasks-per-child=100
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        value: https://algobot.dpdns.org/api/notifications/telegram/webhook/
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_BOT_USERNAME
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_BOT_USERNAME
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          name: AlgoBot
          type: web
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: DATABASE_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          name: AlgoBot
          type: web
          envVarKey: REDIS_URL
      - key: USE_REDIS
        fromService:
          name: AlgoBot
          envVarKey: USE_REDIS
      - key: USE_CELERY
        value: "true"
      - key: SECRET_KEY
        fromService:
          name: AlgoBot
          type: web
          envVarKey: SECRET_KEY
